services:
  db:
    image: postgres:16-alpine
    container_name: qms-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 5

  # Applies the Goose migrations, then exits. The API waits for it to
  # finish successfully, so a fresh volume is fully migrated and seeded
  # before the first request can arrive.
  migrator:
    image: gomicro/goose:latest
    container_name: qms-migrator
    working_dir: /migrations
    volumes:
      - ./sql/schema:/migrations
    entrypoint:
      [
        "goose",
        "-dir",
        "/migrations",
        "postgres",
        "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable",
        "up",
      ]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: 20dumpling/ea-qms-backend:1.2.1
    container_name: qms-api
    restart: unless-stopped
    ports:
      - "1304:1304"
    env_file:
      - .env
    # ⚠ Overrides any DB_URL from .env. Inside the network, Postgres is
    # reachable as `db`, never localhost. Built from the same three
    # values the database was created with, so there is one password in
    # one place.
    environment:
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  pgdata:
