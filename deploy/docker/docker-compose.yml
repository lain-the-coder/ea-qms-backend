services:
  db:
    image: postgres:16-alpine
    container_name: qms-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ea_qms"]
      interval: 2s
      timeout: 5s
      retries: 5

  migrator:
    image: gomicro/goose:latest
    container_name: qms-migrator
    working_dir: /migrations
    volumes:
      - ./sql/schema:/migrations
    entrypoint:
      [
        "goose",
        "-dir",
        "/migrations",
        "postgres",
        "postgres://postgres:1234@db:5432/ea_qms?sslmode=disable",
        "up",
      ]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: 20dumpling/ea-qms-backend:1.1.0
    container_name: qms-api
    restart: unless-stopped
    ports:
      - "1304:1304"
    env_file:
      - .env
    environment:
      - DB_URL=postgres://postgres:1234@db:5432/ea_qms?sslmode=disable
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  pgdata:
